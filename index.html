<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="index.css" />
        <title>AquaLens | Home</title>
    </head>
    <body id="home-page">

            <!-- Navigation Bar -->
        <div id="navbar-container"></div>

        <!-- Main Hero Section -->
        <main class="hero">
            <!-- Background layer for smooth transitions -->
            <div class="hero-bg"></div>

            <div class="overlay">
                <div class="content">
                    <h1>
                        Ever wondered what that cool fish you saw was? With AquaLens, you'll never have to ask yourself this question again. 
                        Our camera will tell you everything you want to know on the spot. Whether you're a marine biologist, a diver or simply 
                        an ocean lover, the AquaLens is made for you!
                    </h1>
                    <div class="button-container">
                        <a href="src/product/product.html" class="button">Discover</a>
                    </div>
                </div>
            </div>
        </main>

        <!-- Background Cycling Script -->
        <script>
            const heroImages = [
                "images/Underwater.png",
                "images/Underwater 2.webp",
                "images/Underwater 3.webp",
                "images/anemone.jpg"
            ];

            let current = 0;
            const heroBg = document.querySelector('.hero-bg');
            const changeInterval = 5000; // 5 seconds

            // Preload images for smooth transitions
            heroImages.forEach(src => {
                const img = new Image();
                img.src = src;
            });

            // Initialize first background
            heroBg.style.backgroundImage = `url('${heroImages[current]}')`;

            function changeHeroBackground() {
                heroBg.classList.add('fade-out');

                setTimeout(() => {
                    current = (current + 1) % heroImages.length;
                    heroBg.style.backgroundImage = `url('${heroImages[current]}')`;
                    heroBg.classList.remove('fade-out');
                }, 1500); // matches CSS transition duration
            }

            setInterval(changeHeroBackground, changeInterval);
        </script>

        <!-- footer -->
        <div id="footer-container"></div>
        
        <!--Navagation Bar and Footer-->
        <script>
        // Fetch Nav bar
        fetch('nav_bar.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;

                // Fix image paths for subdirectory
                const logoImg = document.getElementById('logo-img');
                const hamburgerImg = document.getElementById('hamburger-img');
                const logoLink = document.querySelector('.logo');

                if (logoImg) logoImg.src = '../../images/AquaLens-Logo.png';
                if (hamburgerImg) hamburgerImg.src = '../../images/Hamburger_Menu_Nav_bar.png';
                if (logoLink) logoLink.href = '../../index.html';
            });

            // Fetch footer
            fetch('footer.html')
                .then(res => res.text())
                .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });

            const links = document.querySelectorAll('.navbar a');
            links.forEach(link => {
                const linkFile = link.getAttribute('href').split('/').pop();
                const currentFile = window.location.pathname.split('/').pop();

                if (linkFile === currentFile) {
                    link.classList.add('active');
                }
            });

            function toggleMenu() {
                const dropdown = document.getElementById('mobileDropdown');
                dropdown.classList.toggle('show');
            }   
        </script>

    </body>
</html>
